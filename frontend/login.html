<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureVault - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body class="login-body">

    <main class="login-wrap">

        <h1 class="login-title">SecureVault</h1>
        <p class="login-sub">Login to access your secure vault.</p>

        <section class="login-card">

            <h2>Welcome Back</h2>
            <p class="login-hint">Your files are waiting for you.</p>

            <div class="field">
                <span class="field-icon">✉️</span>
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
            </div>

            <div class="field">
                <span class="field-icon">🔒</span>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                <button type="button" class="eye-btn" id="togglePassword" aria-label="Show password">👁️</button>
            </div>

            <label class="remember">
                <input type="checkbox" id="rememberDevice">
                <span>Remember this device</span>
            </label>

            <button id="loginBtn" class="login-btn">Login 🔐</button>

            <p id="message"></p>

            <p class="switch-text">
                Don't have an account? <a href="register.html">Register</a>
            </p>

        </section>

        <p class="login-footer">🔒 Your security is our priority.</p>

    </main>

    <script src="login.js"></script>

    <script>
        document.getElementById("togglePassword").addEventListener("click", () => {
            const p = document.getElementById("password");
            p.type = p.type === "password" ? "text" : "password";
        });
    </script>

</body>

</html>
